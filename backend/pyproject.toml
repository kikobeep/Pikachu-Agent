[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "pikachu"
version = "0.1.0"
description = "A local terminal coding agent"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.22",
    "numpy>=2.0",
    "openai>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "python-dotenv>=1.0",
    "PyYAML>=6.0",
    "requests>=2.0",
    "tiktoken>=0.7",
    "tqdm>=4.0",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
]

[project.scripts]
pikachu = "app.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]
